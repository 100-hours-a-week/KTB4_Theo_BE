spring:
  profiles:
    default: local

  config:
    import: optional:file:.env[.properties]

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  application:
    name: community-api

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/community_api?serverTimezone=UTC&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000
  issuer: community-api

notification:
  sse:
    heartbeat:
      enabled: ${SSE_HEARTBEAT_ENABLED:true}
      interval: ${SSE_HEARTBEAT_INTERVAL:60s}

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

image:
  orphan-cleanup:
    enabled: ${IMAGE_ORPHAN_CLEANUP_ENABLED:false}
    dry-run: ${IMAGE_ORPHAN_CLEANUP_DRY_RUN:true}
    grace-period: ${IMAGE_ORPHAN_CLEANUP_GRACE_PERIOD:24h}
    cron: ${IMAGE_ORPHAN_CLEANUP_CRON:0 0 4 * * *}
