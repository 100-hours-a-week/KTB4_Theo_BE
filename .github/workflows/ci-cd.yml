name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run tests
        env:
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: ./gradlew test --no-daemon

  build-and-deploy:
    name: Build, Push and Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/community-api-be:latest
            ${{ secrets.DOCKER_USERNAME }}/community-api-be:${{ github.sha }}
          cache-from: type=gha,scope=community-api-be
          cache-to: type=gha,mode=max,scope=community-api-be

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend to EC2
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'set -e
             cd "/home/${USER}/community"
             docker compose pull backend
             docker compose up -d --no-deps backend
             sleep 10

             if [ "$(docker inspect --format="{{.State.Running}}" community-api-be)" != "true" ]; then
               docker compose logs --tail=100 backend
               exit 1
             fi

             docker compose ps backend
             docker image prune -f'
